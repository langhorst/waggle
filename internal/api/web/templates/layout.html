<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Waggle</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>🐝</text></svg>">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/tailwind.js"></script>
  <script src="/static/htmx.min.js"></script>
  <script src="/static/flowbite.min.js" defer></script>
  {{block "head" .}}{{end}}
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <nav class="bg-white border-b border-gray-200 dark:bg-gray-800 dark:border-gray-700">
    <div class="max-w-screen-xl mx-auto px-4 py-3 flex items-center gap-6">
      <a href="/" class="flex items-center gap-2">
        <span class="text-xl font-semibold text-gray-900 dark:text-white">🐝 Waggle</span>
      </a>
      <a href="/" class="text-sm text-gray-600 hover:text-blue-700 dark:text-gray-300">Channels</a>
      <span id="sse-status" class="ms-auto text-xs text-gray-400">connecting…</span>
    </div>
  </nav>

  <main class="max-w-screen-xl mx-auto px-4 py-6">
    {{template "content" .}}
  </main>

  <script>
    // Live updates: the daemon's SSE stream carries IDs only; partials
    // refetch on these custom events (see hx-trigger attributes).
    (function () {
      const status = document.getElementById('sse-status');
      const es = new EventSource('/api/events');
      const fire = (name) => document.body.dispatchEvent(new CustomEvent(name, { bubbles: true }));
      es.onopen = () => { status.textContent = 'live'; status.className = 'ms-auto text-xs text-green-500'; };
      es.onerror = () => { status.textContent = 'disconnected'; status.className = 'ms-auto text-xs text-red-500'; };
      es.addEventListener('message', () => fire('sse-message'));
      es.addEventListener('channel_status', () => { fire('sse-channel'); fire('sse-message'); });
      es.addEventListener('resync', () => { fire('sse-channel'); fire('sse-message'); });
    })();
  </script>
</body>
</html>
