{{define "content"}}
<div class="flex items-center justify-between mb-4">
  <h1 class="text-xl font-bold text-gray-900 dark:text-white font-mono">{{.Path}}</h1>
  <div class="flex items-center gap-3">
    <span id="save-result" class="text-sm"></span>
    <button id="save-btn"
      class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-5 py-2 dark:bg-blue-600 dark:hover:bg-blue-700">
      Save
    </button>
  </div>
</div>
<p class="text-xs text-gray-400 mb-2">
  Saving recompiles immediately; a compile error keeps the previous version running and is shown here.
</p>
<textarea id="editor" spellcheck="false"
  class="block w-full h-[32rem] p-4 font-mono text-sm text-gray-100 bg-gray-900 rounded-lg border border-gray-700 focus:ring-blue-500 focus:border-blue-500">{{.Content}}</textarea>

<script>
  document.getElementById('save-btn').addEventListener('click', async () => {
    const result = document.getElementById('save-result');
    result.textContent = 'saving…';
    result.className = 'text-sm text-gray-400';
    const resp = await fetch('/api/scripts?path=' + encodeURIComponent({{.Path}}), {
      method: 'PUT',
      body: document.getElementById('editor').value,
    });
    const body = await resp.json();
    if (resp.ok) {
      result.textContent = 'saved & reloaded';
      result.className = 'text-sm text-green-600 dark:text-green-400';
    } else {
      result.textContent = body.error || 'save failed';
      result.className = 'text-sm text-red-600 dark:text-red-400';
    }
  });
</script>
{{end}}
