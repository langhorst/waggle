# golangci-lint v2 configuration. `make lint` runs this; CI enforces it.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - gosec
    - nilerr
    - noctx
    - unparam
  settings:
    staticcheck:
      # Quickfix suggestions (QF*) are stylistic; keep the checks that
      # find bugs.
      checks: ["all", "-QF1*", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
    errcheck:
      # Close/Rollback/Remove in cleanup paths and writes to an HTTP
      # response are deliberately fire-and-forget; the surrounding code
      # handles the failure that matters.
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Rows).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*database/sql.DB).Close
        - (*github.com/langhorst/waggle/internal/store.Store).Close
        - os.Remove
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G104 # duplicates errcheck
        - G304 # file paths come from operator config by design
        - G306 # 0644 for operator-editable script files is intended
        - G301 # 0755 data directories are intended for an operator-run daemon
        - G302 # 0644 log files likewise
        - G404 # math/rand is fine for retry jitter
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx
          - bodyclose
          - unparam

formatters:
  enable:
    - gofmt
